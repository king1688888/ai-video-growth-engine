name: Staging Deploy & Verify

on:
  workflow_dispatch:
  push:
    branches: [staging]

jobs:
  validate-env-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure no real secrets in .env.example
        run: |
          if grep -E "OPENAI_API_KEY=sk-[A-Za-z0-9]{30,}" .env.example; then
            echo "FAIL: .env.example may contain a real API key"
            exit 1
          fi
          for var in DATABASE_URL JWT_SECRET REDIS_URL FEATURE_MOCK_AI; do
            if ! grep -q "^${var}=" .env.example; then
              echo "FAIL: $var missing in .env.example"
              exit 1
            fi
          done
          echo "OK: .env.example sanity check passed"

  migration-dry-run:
    runs-on: ubuntu-latest
    needs: validate-env-example
    steps:
      - uses: actions/checkout@v4
      - name: Show migration files
        run: |
          echo "Pending migration SQL files:"
          ls -la packages/database/prisma/ 2>/dev/null || echo "(no Prisma schema)"
          ls -la drizzle/*.sql 2>/dev/null || echo "(no Drizzle migrations)"

  smoke-test-plan:
    runs-on: ubuntu-latest
    needs: validate-env-example
    steps:
      - uses: actions/checkout@v4
      - name: Print smoke test plan
        run: |
          test -f docs/deployment/staging_smoke_test_plan.md && head -50 docs/deployment/staging_smoke_test_plan.md || true
          echo "Smoke tests must be executed by Owner against the staging URL."

  rollback-dry-run:
    runs-on: ubuntu-latest
    needs: validate-env-example
    steps:
      - uses: actions/checkout@v4
      - name: Verify rollback docs exist
        run: |
          test -f docs/acceptance/rollback_plan.md && echo "Rollback plan exists" || (echo "Missing rollback plan" && exit 1)
